# 集群终端级冒烟 compose：通过顶层 include 引入 deploy/cluster/docker-compose.yml，
# 因此可在本目录直接执行 docker-compose up -d，无需额外 -f 或预先 export 变量。
# run.sh 与 make smoke-cluster（scripts/smoke-cluster.sh）仍可继续使用。
#
# 在 deploy/cluster/docker-compose.yml 基础上：
#   - 把 jt808 角色镜像替换成本地构建的冒烟镜像（不重新 tag latest）；
#   - 用目录内的 1 号网关配置覆盖 jt-signal；
#   - 增加 2 号网关 jt-signal-2，用于验证下行按目录路由与会话归属转移；
#   - 增加 jt808-client 终端模拟器，与集群同一网络，默认连 jt-signal:8080。
#
# 可选环境变量（均有默认值，run.sh 会按需设置）：
#   JT808_SMOKE_IMAGE        服务端镜像，默认 fakeyanss/jt808-server-go:latest
#   JT808_SMOKE_CLIENT_IMAGE 终端镜像，默认 fakeyanss/jt808-client-go:latest
#   JT808_SMOKE_CONFIG_DIR   网关配置目录，默认为本目录（含 signal-1.yaml / signal-2.yaml）
include:
  - path: ../../cluster/docker-compose.yml

name: jt808-cluster

services:
  jt808-client:
    image: ${JT808_SMOKE_CLIENT_IMAGE:-fakeyanss/jt808-client-go:latest}
    build:
      context: ../../..
      dockerfile: build/Dockerfile.client
      args:
        VERSION: local
    restart: "no"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - jt808-client-logs:/app/logs
    security_opt:
      - no-new-privileges:true
    depends_on:
      jt-signal:
        condition: service_started

  shared-volume-init:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
  migrate:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
  jt-control:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
  jt-media:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
  jt-attachment:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
  jt-signal:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
    volumes:
      - ${JT808_SMOKE_CONFIG_DIR:-.}/signal-1.yaml:/etc/jt808/signal.yaml:ro
  jt-signal-2:
    image: ${JT808_SMOKE_IMAGE:-fakeyanss/jt808-server-go:latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      JT808_ROLE: signal
      JT808_PROBE_ADDR: 127.0.0.1:9116
    ports:
      - "18080:8080/tcp" # 2 号网关的终端接入端口
    volumes:
      - ${JT808_SMOKE_CONFIG_DIR:-.}/signal-2.yaml:/etc/jt808/signal.yaml:ro
      - jt808-signal2-data:/app/data
      - jt808-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      jt-control:
        condition: service_started

volumes:
  jt808-signal2-data:
  jt808-client-logs:
