name: jt808

# memory 后端 standalone 示例：不依赖任何外部服务，开箱即跑。
# 启动：docker compose -f deploy/docker-compose.yml up -d
# 配置覆盖：把自己的 YAML 挂载到 /etc/jt808/standalone.yaml，或用 JT808_CONFIG 指定路径。
services:
  jt808:
    image: fakeyanss/jt808-server-go:latest
    build:
      context: ..
      dockerfile: build/Dockerfile
      args:
        VERSION: local
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JT808_ROLE: standalone
    ports:
      - "8080:8080/tcp"   # 808 终端接入
      - "8081:8081/udp"   # 808 终端接入
      - "8008:8008/tcp"   # 业务 API
      - "7200:7200/tcp"   # 苏标附件
      - "7201:7201/udp"   # 苏标附件
    volumes:
      - jt808-data:/app/data
      - jt808-logs:/app/logs
      # - ./my-standalone.yaml:/etc/jt808/standalone.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/jt808-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  jt808-data:
  jt808-logs:
