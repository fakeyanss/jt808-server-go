log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "DEBUG"
  logDirectory: "./logs/"
  logFile: "jt808-server-go.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 128
  maxAgeOfRolling: 7

server:
  name: "jt808-server-go"
  # standalone：全量缓存 + HTTP API（默认，保持历史行为）；gateway：仅协议接入，业务数据走 Action 回调
  mode: "standalone"
  ackTimeoutMs: 5000
  maxRetransmissions: 3
  # gateway 模式下的业务数据回调示例；url 为空时不启用
  action:
    http:
      url: ""
      timeoutMs: 2000
  port:
    tcpPort: "8080"
    udpPort: "8081"
    httpPort: "8008"
  banner:
    enable: true
    bannerPath: "configs/banner.txt"
