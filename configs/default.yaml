log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "DEBUG"
  logDirectory: "./logs/"
  logFile: "jt808-server-go.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 128
  maxAgeOfRolling: 7

server:
  name: "jt808-server-go"
  ackTimeoutMs: 5000
  maxRetransmissions: 3
  # 设备运行时状态（session/在线态/最后通信时间）只存在于进程内，不落库，
  # 因此不再提供心跳落库节流配置；进程重启后运行时状态自然归零。
  # 业务数据 Action 回调示例；url 为空时不启用
  action:
    http:
      url: ""
      timeoutMs: 2000
  port:
    tcpPort: "8080"
    udpPort: "8081"
    httpPort: "8008"
  banner:
    enable: true
    bannerPath: "configs/banner.txt"

# 苏标主动安全附件服务器。port 为空或整段缺省时不启动，行为与旧版本一致。
# 附件落盘目录结构为 <dir>/<手机号>/<YYYYMMDD>/<报警编号>/<文件名>。
alarmServer:
  port: "7200"
  dir: "./data/alarms"
  maxFileSize: 104857600
  maxConcurrent: 16

# 持久化数据保留策略。整段缺省时使用代码内置默认值，行为与之前的进程内实现一致。
# 显式写 0 表示关闭对应策略（0 天不做时间清理、0 条不限制上限、0 毫秒不去重）。
# JT/T 808 未规定平台侧保存期限，定位 7 天 / 10000 条为自行设定的工程默认值；
# 报警 30 分钟去重 / 10 分钟确认关联 / 1000 条沿用既有内存实现。
retention:
  locations:
    retentionDays: 7
    maxPerDevice: 10000
  alarms:
    dedupWindowMs: 1800000
    confirmExpireMs: 600000
    maxPerDevice: 1000

# 持久化后端：memory | sqlite | mysql，缺省 memory（行为与旧版本一致）
storage:
  type: "memory"
  sqlite:
    path: "./data/jt808.db"
  mysql:
    dsn: ""
    # sqlite / mysql 均不在服务启动时执行迁移；首次部署或升级后先执行独立工具：
    #   jt808-migrate -c <config file>
    # 主服务启动只校验 schema 版本，版本不符会拒绝启动。
