log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "DEBUG"
  logDirectory: "./logs/"
  logFile: "jt808-server-go.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 128
  maxAgeOfRolling: 7

server:
  name: "jt808-server-go"
  # standalone（缺省）：四角色同进程，零外部依赖，行为与旧版本一致。
  # cluster：按 cluster.roles 拆进程；E1 仅用于验证两个内部 HTTP 契约，不承接业务，不可上生产。
  mode: "standalone"
  ackTimeoutMs: 5000
  maxRetransmissions: 3
  # 设备运行时状态（session/在线态/最后通信时间）只存在于进程内，不落库，
  # 因此不再提供心跳落库节流配置；进程重启后运行时状态自然归零。
  # 业务数据 Action 回调示例；url 为空时不启用
  action:
    http:
      url: ""
      timeoutMs: 2000
  port:
    tcpPort: "8080"
    udpPort: "8081"
    httpPort: "8008"
  banner:
    enable: true
    bannerPath: "configs/banner.txt"

# 苏标主动安全附件服务器。port / udpPort 都为空或整段缺省时不启动，行为与旧版本一致。
# 附件落盘目录结构为 <dir>/<手机号>/<YYYYMMDD>/<报警编号>/<文件名>。
alarmServer:
  # TCP 监听端口；port 与 udpPort 都为空时附件服务器不启动。
  port: "7200"
  # UDP 监听端口；与 TCP 共用同一套组装逻辑。留空表示只提供 TCP。
  udpPort: "7201"
  dir: "./data/alarms"
  maxFileSize: 104857600
  maxConcurrent: 16
  # 已完成附件的内存状态保留时长；到期后仅释放内存，.meta.json 仍可查询。
  # 显式 0 表示不淘汰，留空使用默认值 20m。
  completedTTL: "20m"
  # 已完成附件文件的落盘保留天数；每小时扫描一次目录，显式 0 表示不清理。
  retentionDays: 7
  # 报警首次上报时是否自动下发 0x9208（报警附件上传指令）。
  # 默认 false，保持仅通过 API 手动下发的既有行为。
  autoUpload: false
  # autoUpload 开启时必填：写入 0x9208 的附件服务器 IP。
  # 端口不单独配置，0x9208 直接通告 port / udpPort 的实际监听端口；
  # 未配置的一侧通告为 0，表示该协议不可用。
  uploadIP: ""

# JT/T 1078 音视频接入。port 与 tcpPort 均为空或整段缺省时不启动，行为与旧版本一致。
# 两个端口相互独立，可只启用一个或同时启用；0x9101 下发的服务器端口应与这里保持一致。
# 支持 H.264 视频与 G.711A/U、ADTS AAC 音频，输出 .h264/.g711a/.g711u/.aac 文件，
# 不做转码与分发。视频在每个 IDR 前补齐 SPS/PPS，音频为裸流（G.711 需按 8kHz 单声道播放）。
mediaServer:
  # UDP 监听端口，留空表示不启用 UDP 接入。
  port: ""
  # TCP 监听端口，留空表示不启用 TCP 接入。
  tcpPort: ""
  dir: "./data/media"
  # 并发流上限，UDP 与 TCP 合计。
  maxConcurrent: 16
  # 单实例的 TCP 连接数上限，与流数限制相互独立。
  maxTCPConns: 64
  # 音视频文件落盘保留天数；每小时扫描一次目录，显式 0 表示不清理。
  retentionDays: 7

# 0x0801 多媒体文件落盘目录。落盘始终启用，本段只决定存放位置。
# 文件按 <dir>/<手机号>/<YYYYMMDD>/<媒体ID>.<扩展名> 分层；
# 集群模式要求该目录位于所有节点可见的共享卷上。
mediaUpload:
  dir: "./data/media-uploads"

# 独立管理面 HTTP 监听。enable 缺省 false，不启动管理端口，
# 终端接入端口、既有 HTTP API 与苏标/媒体服务行为完全不变。
# 开启后必须配置非空 token；所有管理接口要求 Authorization: Bearer <token>。
# 会话运维只作用于当前进程实例，多实例部署时不具备跨节点语义。
admin:
  enable: false
  addr: "127.0.0.1:9000"
  token: ""
  # 令牌桶限流：ratePerSecond 为每秒补充令牌数，burst 为桶容量。
  # keyBy 可选 credential（按凭据，单 token 时等价全局）或 source（按来源 IP）。
  rateLimit:
    ratePerSecond: 10
    burst: 20
    keyBy: "credential"

# 独立的存活/就绪探针监听。只暴露 /healthz 与 /readyz，不承载业务接口、不做鉴权。
# 通用入口未配置时不启动，保持既有行为；四个角色二进制必须配置。
probes:
  addr: ""

# 业务 API 鉴权、限流与审计。
# token 为空表示鉴权关闭，仅建议在可信内网临时使用；生产环境必须配置。
# 变更类请求（POST/PUT/PATCH/DELETE）与鉴权失败会写入审计日志。
api:
  auth:
    token: ""
  rateLimit:
    # 按来源 IP 的令牌桶；ratePerSecond 为每秒补充令牌数，burst 为桶容量。
    ratePerSecond: 50
    burst: 100

# 持久化数据保留策略。整段缺省时使用代码内置默认值，行为与之前的进程内实现一致。
# 显式写 0 表示关闭对应策略（0 天不做时间清理、0 条不限制上限、0 毫秒不去重）。
# JT/T 808 未规定平台侧保存期限，定位 7 天 / 10000 条为自行设定的工程默认值；
# 报警 30 分钟去重 / 10 分钟确认关联 / 1000 条沿用既有内存实现。
retention:
  # 定位历史：retentionDays 同时用于写入时的按设备裁剪和定期全局清理。
  # 0 表示不按时间清理；未配置时默认 7 天（保持既有行为）。
  locations:
    retentionDays: 7
    maxPerDevice: 10000
  alarms:
    dedupWindowMs: 1800000
    confirmExpireMs: 600000
    maxPerDevice: 1000
    # 按接收时间的定期清理；未配置或 0 表示不按时间清理。
    retentionDays: 0
  # 0x0801 媒体文件：按服务端接收时间清理元数据，并删除对应落盘文件。
  # 未配置或 0 表示关闭。清理顺序为先删文件、再删元数据，失败保留元数据待下次重试。
  mediaFiles:
    retentionDays: 0
  # 0x0805 拍摄应答（media_captures 及明细）：按服务端接收时间清理。
  # 未配置或 0 表示关闭。
  mediaCaptures:
    retentionDays: 0
  # 0x0802 存储多媒体检索应答（media_search_results）：按自身接收时间清理。
  # 未配置或 0 表示关闭，与 alarms / mediaFiles 保持一致。
  mediaSearchResults:
    retentionDays: 0
  # 媒体目录孤儿文件扫描：只删除“库中无 media_files 记录且文件 mtime 超过宽限期”的文件。
  # 判定依据是文件自身 mtime，不是 <手机号>/<YYYYMMDD> 目录名，
  # 因此补传到旧目录的新文件不会被误删。默认关闭，仅 SQL 后端启用。
  orphanFiles:
    enabled: false
    # 文件 mtime 的最小年龄；必须 >= 1 天，默认 7 天，远大于正常补传/重传窗口。
    graceDays: 7
    # 扫描周期，必须为正的 Go duration；默认 24h（磁盘扫描比数据库清理更重）。
    interval: "24h"
    # 单次扫描的文件上限，达到后提前结束并在下次运行继续；范围 1~1000000。
    maxFilesPerRun: 10000
    # 每批比对数据库的文件数，0 取默认 500，上限 5000；批间会短暂让出。
    batchSize: 500
  # 历史数据定期清理任务。默认关闭，未显式开启时不改变现有部署的数据保留情况。
  # 仅 SQL 后端（sqlite/mysql）生效；memory 后端数据随进程结束释放，跳过并告警。
  cleanup:
    enabled: false
    # 清理周期，必须为正的 Go duration（如 1h、30m）。
    interval: "1h"
    # 单批删除行数，0 取默认 1000，上限 5000；批间会短暂让出，避免长时间锁表。
    batchSize: 1000

# 下行命令 outbox 重投（memory / durable 模式）。
# durable 下进程重启后 pending 命令按下面的节奏重新投给在线会话；memory 重启即丢。
# 重投复用原始流水号，语义是 at-least-once：终端可能重复执行同一条命令。
# initialWait 必须覆盖一次下发到会话重传耗尽的窗口（ackTimeout × (maxRetransmissions+1)），
# 否则会在会话仍在重传时重复下发。
commandOutbox:
  # off | memory | durable；缺省按存储后端归一化：memory 后端默认 memory，SQL 后端默认 durable。
  # off 直连下发，不落 outbox、不可查；memory 保留幂等与状态查询但重启即丢。
  # mode: memory
  pollInterval: "10s"
  batchSize: 50
  # 总下发次数上限（含首次下发）；达到上限后转 failed，不做无限重试。
  maxAttempts: 5
  # 单次投递的租约时长，覆盖下发到应答返回的窗口；到期后其它实例可重新占用。
  leaseDuration: "1m"
  retryBase: "5s"
  retryMax: "5m"
  # 设备离线时的短退避：租约释放、attempts 不递增，但下一次尝试至少推迟这么久。
  offlineRetry: "15s"
  # 设备长期不在线时的兜底：超过该时长仍未投递成功转 failed。
  expireAfter: "24h"
  # 首次下发后等待应答/会话重传的窗口，到期前不重投。
  initialWait: "1m"
  # 终端明确执行失败（0x0001 Result=1）后是否重投。默认 false：
  # 终端已经执行过，重投可能造成重复副作用；Result=2/3 始终终结，不受此开关影响。
  retryOnTerminalFailure: false

# 上行可靠性：按消息分类选择 best_effort / at_least_once。
# best_effort：先应答后落库；落库失败只记日志，不等终端重传。
# at_least_once：先完成落库再应答；落库失败不应答，由终端按协议重传。
# 默认实时定位 best-effort（很快就有下一条），批量定位与报警 at-least-once。
uplink:
  # 上行出口：local（默认，进程内直连内置处理）| http（HTTP hook）。
  # local 不产生外部依赖、不新增监听端口；http 需要显式配置 url 与 token。
  sink: "local"
  # 仅 sink=http 时生效。
  http:
    # 绝对 http(s) 地址，例如 http://127.0.0.1:9090/internal/v1/uplink。
    url: ""
    # 共享凭据，以 Authorization: Bearer <token> 发送；http 出口不允许为空。
    token: ""
    # 单次投递超时；confirm-before-ack 必须小于终端重传窗口。
    timeoutMs: 3000
    # best-effort 有界队列容量，满时丢弃并计数；也是 confirm-before-ack 的并发上限。
    queueSize: 1024
    # best-effort 后台 worker 数。
    workers: 4
    # 单条事件投递次数上限（含首次）；默认不重试，允许 1..3。
    maxAttempts: 1
    # 事件信封中的网关标识；缺省为 主机名-进程号。
    gatewayId: ""
  reliability:
    # 取值 best_effort 或 at_least_once（confirm_before_ack 等价于 at_least_once）。
    default: "best_effort"
    location: "best_effort"
    batchLocation: "at_least_once"
    alarm: "at_least_once"

# 集群角色拆分。仅当 server.mode=cluster 时生效；standalone 下本段必须为空。
# 四个角色：gateway（808 接入）、control（管控/API）、media（1078）、attachment（苏标附件）。
# E1 只交付 gateway/control 的两个内部 HTTP 契约与启动校验；media/attachment 只校验配置，
# cluster 不承接业务，业务处理仍在网关进程内，可用性从后续阶段起算。
cluster:
  roles: []
  gateway:
    # 网关侧下行 HTTP 入口监听地址；role=gateway 必填。
    addr: ""
    # 管控侧调用下行入口的基址；role=control 必填。
    url: ""
    # control -> gateway 共享密钥（Authorization: Bearer）。role=gateway 必填。
    token: ""
  control:
    # 管控侧上行 HTTP 入口监听地址；role=control 必填。
    addr: ""
    # gateway -> control 共享密钥。role=control 必填，且必须与 uplink.http.token 一致。
    token: ""
  media:
    # 本进程作为媒体节点时，在 /internal/media/status 里回报的节点标识；为空时按播出地址推导。
    nodeId: ""
    # 管控可调度的媒体节点清单；control 角色用，地址为媒体节点 mediaServer.httpPort 基址。
    # 无本地媒体且列表为空时，播放接口返回 no_media_node_configured，/readyz 的 media_nodes 失败。
    nodes: []
    # - name: "media-1"
    #   url: "http://10.0.0.12:7301"
  downlink:
    # sync_ack 等待上限；默认 8s，不得超过 ackTimeoutMs × (maxRetransmissions+1)。
    timeoutMs: 8000
    # 网关在途记录保留时长，也是幂等窗口；未知 id 返回 404，过期返回 410。
    idempotencyTTL: "2m"
    # 并发 sync_ack 等待上限，超出返回 429。
    maxInFlight: 256
  uplink:
    # eventId 去重窗口，必须覆盖网关超时与重试窗口。
    dedupTTL: "10m"
    dedupMaxEntries: 100000
    # 单个上行请求体上限；超出返回 413。
    maxBodyBytes: 4194304
  storage:
    # local | sharedVolume | objectStore。
    # media/attachment 角色必须使用 sharedVolume（带标记）或 objectStore（E1 未实现，启动拒绝）。
    backend: "local"
    # sharedVolume 必须显式为 true，避免把本机独占目录误当成共享卷。
    sharedVolume: false
    # 共享卷根目录下由部署创建的标记文件。
    marker: ".jt808-shared-volume"
    root: "./data/blobs"

# 持久化数据库：memory | sqlite | mysql，缺省 memory（行为与旧版本一致）
database:
  type: "memory"
  sqlite:
    path: "./data/jt808.db"
    # 只读连接池大小；0 表示按 CPU 数。写池固定 1 连接，不是调优参数。
    readConns: 0
  mysql:
    dsn: ""
    # sqlite / mysql 均不在服务启动时执行迁移；首次部署或升级后先执行独立工具：
    #   jt808-migrate -c <config file>
    # 主服务启动只校验 schema 版本，版本不符会拒绝启动。
