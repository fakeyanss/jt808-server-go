log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "DEBUG"
  logDirectory: "./logs/"
  logFile: "jt808-server-go.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 128
  maxAgeOfRolling: 7

server:
  name: "jt808-server-go"
  ackTimeoutMs: 5000
  maxRetransmissions: 3
  # 心跳落库最小间隔（毫秒）：0 或缺省表示逐条写库；若开启，建议不超过保活周期的一半
  # （当前保活周期 1 分钟，即建议 30000）。间隔过大时库内 last_com_time 会落后，
  # 读路径的 TTL 判定可能在心跳恢复落库前把设备短暂判为离线。
  heartbeatPersistIntervalMs: 0
  # 业务数据 Action 回调示例；url 为空时不启用
  action:
    http:
      url: ""
      timeoutMs: 2000
  port:
    tcpPort: "8080"
    udpPort: "8081"
    httpPort: "8008"
  banner:
    enable: true
    bannerPath: "configs/banner.txt"

# 持久化后端：memory | sqlite | mysql，缺省 memory（行为与旧版本一致）
storage:
  type: "memory"
  sqlite:
    path: "./data/jt808.db"
    # 仅 SQLite 生效，缺省 true：启动时自动应用迁移。
    # MySQL 不自动迁移（生产库通常禁止运行时 DDL），需先执行 `jt808-server -c <config> migrate`。
    autoMigrate: true
  mysql:
    dsn: ""
