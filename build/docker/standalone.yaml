# 容器内 standalone 默认配置：memory 后端，开箱即跑。
# 需要持久化或集群角色时，通过 -c / JT808_CONFIG 挂载自己的配置覆盖本文件。
log:
  consoleEnable: true
  fileEnable: true
  printAsJson: false
  logLevel: "INFO"
  logDirectory: "./logs/"
  logFile: "jt808-server.log"
  maxSizeOfRolling: 50
  maxBackupsOfRolling: 7
  maxAgeOfRolling: 7

server:
  name: "jt808-server-go"
  mode: "standalone"
  ackTimeoutMs: 5000
  maxRetransmissions: 3
  port:
    tcpPort: "8080"
    udpPort: "8081"
    httpPort: "8008"
  banner:
    enable: false

alarmServer:
  port: "7200"
  udpPort: "7201"
  dir: "./data/alarms"
  maxFileSize: 104857600
  maxConcurrent: 16
  autoUpload: false

mediaUpload:
  dir: "./data/media-uploads"

admin:
  enable: false
  addr: "127.0.0.1:9000"
  token: ""

# 健康检查依赖该就绪接口；只监听容器内回环，不对外发布。
probes:
  addr: "127.0.0.1:9105"

api:
  auth:
    token: ""

uplink:
  sink: "local"

commandOutbox:
  mode: "memory"

database:
  type: "memory"
