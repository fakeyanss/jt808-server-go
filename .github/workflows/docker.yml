name: docker

on:
  push:
    branches: ["main", "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "dev/**"]
  # release 事件不再重复触发：发布 release 前必然先推送同名的 v* tag，
  # tag 推送已经会发布镜像。重复监听会让同一次发布构建两遍。
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（不含 v；留空时取最近的 Git tag）"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: fakeyanss/jt808-server-go

jobs:
  prepare:
    name: prepare image metadata
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      build_time: ${{ steps.meta.outputs.build_time }}
      skip_reason: ${{ steps.meta.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image metadata and enforce main-only publish
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git fetch --no-tags --force origin main:refs/remotes/origin/main

          # 只有 tag 推送、手动触发是发布候选；分支 push/PR 永远只构建。
          candidate=false
          is_main=false
          skip_reason=""
          case "$EVENT_NAME" in
            push)
              if [ "$REF_TYPE" = "tag" ]; then
                candidate=true
              fi
              ;;
            workflow_dispatch)
              candidate=true
              if [ "$REF" = "refs/heads/main" ]; then
                is_main=true
              else
                skip_reason="manual dispatch on ${REF}; only refs/heads/main can publish"
              fi
              ;;
          esac

          # tag 不能只看事件名：tag 必须指向 main 上的提交。
          if [ "$candidate" = "true" ] && [ "$is_main" = "false" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              :
            elif git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              is_main=true
            else
              skip_reason="${REF_TYPE} ${REF_NAME} is not contained in main"
            fi
          fi

          version=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          version="${version#v}"

          publish=false
          if [ "$candidate" = "true" ] && [ "$is_main" = "true" ]; then
            publish=true
          fi
          if [ "$publish" = "false" ]; then
            if [ -z "$skip_reason" ]; then
              skip_reason="event ${EVENT_NAME} does not publish"
            fi
            version="sha-$(git rev-parse --short HEAD)"
            echo "::notice::Docker Hub push skipped: ${skip_reason}"
          elif [ -z "$version" ]; then
            echo "::error::cannot resolve image version; pass workflow_dispatch input version"
            exit 1
          fi

          tags="${IMAGE_NAME}:${version}"
          if [ "$publish" = "true" ]; then
            tags="${tags},${IMAGE_NAME}:latest"
          fi

          {
            echo "publish=${publish}"
            echo "version=${version}"
            echo "tags=${tags}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "skip_reason=${skip_reason}"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build only (no push)
    needs: prepare
    if: needs.prepare.outputs.publish != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ needs.prepare.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "publish: skipped - ${{ needs.prepare.outputs.skip_reason }}"
          echo "built tags (not pushed): ${{ needs.prepare.outputs.tags }}"

  publish:
    name: publish to Docker Hub
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # 平台级分支限制：environment 的 Deployment branches 只允许 main。
    # tag/release 的部署 ref 是 tag，environment 还需添加 v* tag 规则，否则 tag/release 会被保护规则拒绝。
    # 凭据必须放在该 environment 下，发布 job 之外不读取任何 Docker Hub secret。
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dockerhub environment 中缺少 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，本次只构建验证，跳过 Docker Hub 推送。"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.creds.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.creds.outputs.enabled == 'true' }}
          tags: ${{ needs.prepare.outputs.tags }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ needs.prepare.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          if [ "${{ steps.creds.outputs.enabled }}" = "true" ]; then
            echo "pushed: ${{ needs.prepare.outputs.tags }}"
          else
            echo "push: skipped - dockerhub environment credentials are missing"
            echo "built tags (not pushed): ${{ needs.prepare.outputs.tags }}"
          fi
