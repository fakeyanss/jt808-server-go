name: docker

on:
  push:
    branches: ["main", "dev/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "dev/**"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: fakeyanss/jt808-server-go

jobs:
  build:
    name: build (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          version="sha-$(git rev-parse --short HEAD)"
          publish=false
          if [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            publish=true
          elif [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
            publish=true
          fi
          tags="${IMAGE_NAME}:${version}"
          if [ "$publish" = "true" ]; then
            tags="${tags},${IMAGE_NAME}:latest"
          fi
          {
            echo "version=${version}"
            echo "publish=${publish}"
            echo "tags=${tags}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials
        id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 未配置，本次只构建验证，跳过 Docker Hub 推送。"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.meta.outputs.publish == 'true' && steps.creds.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.publish == 'true' && steps.creds.outputs.enabled == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "image: ${IMAGE_NAME}"
          echo "tags: ${{ steps.meta.outputs.tags }}"
          echo "push: ${{ steps.meta.outputs.publish == 'true' && steps.creds.outputs.enabled == 'true' }}"
