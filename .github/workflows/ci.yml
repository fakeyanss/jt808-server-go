# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: CI 

on:
  push:
    branches: [ "main", "dev/**" ]
  pull_request:
    branches: [ "main", "dev/**" ]
  workflow_dispatch:

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.26.10'

    - name: Build and Test
      run: make all

    - name: Coverage matrix consistency
      run: ./scripts/check-coverage.sh

    # make all 已在 -race 下跑全量测试；这里再显式点名 outbox 回归，
    # 避免后续重构把 replay 测试移出默认包列表后只剩「绿灯但没跑」。
    - name: Outbox replay regression
      run: |
        set -eo pipefail
        go test -race -count=1 -v \
          ./internal/command/ \
          ./internal/repository/ \
          ./internal/repository/sqlstore/ | tee outbox-regression.log
        grep -q -- '--- PASS: TestReplayAfterRestart' outbox-regression.log
        grep -q -- '--- PASS: TestCommandRepositoryMemoryPendingScanAndLease' outbox-regression.log
        grep -q -- '--- PASS: TestSQLiteCommandOutboxIdempotencyAndResult' outbox-regression.log
