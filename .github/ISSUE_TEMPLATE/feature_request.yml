name: 功能请求
description: 提出新能力、协议覆盖或使用体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先描述场景与约束，而不是只给一个接口名或消息 ID。
        如果建议涉及尚未实现的协议消息，请先查 [协议覆盖矩阵](https://github.com/fakeyanss/jt808-server-go/blob/main/docs/protocol-coverage.md)，避免重复。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 与文档，未找到相同需求
          required: true

  - type: textarea
    id: background
    attributes:
      label: 使用场景
      description: 谁在什么部署形态下遇到什么问题？没有这个能力时现在如何绕过？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述期望的行为、接口或配置；如果涉及协议，请给出标准条款与消息 ID
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - JT/T 808 协议消息
        - 苏标主动安全附件
        - JT/T 1078 音视频
        - 存储后端
        - 下行 outbox / 可靠性
        - 业务 API
        - 管理面 / 可观测性
        - 集群模式
        - 模拟器 / 测试工具
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过哪些替代做法？为什么不够用？

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与边界
      description: 是否影响 Standalone、已有配置、数据库 schema、集群内部契约或对外 API？是否需要迁移？

  - type: dropdown
    id: contribution
    attributes:
      label: 是否愿意提交 PR
      options:
        - 愿意，我可以按 CONTRIBUTING.md 提交
        - 愿意，但需要维护者指导方向
        - 暂不方便，仅提出需求

  - type: textarea
    id: extra
    attributes:
      label: 补充材料
      description: 标准截图、抓包、同类实现参考、验收标准等
